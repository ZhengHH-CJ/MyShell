name: Build UEFI Shell
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载官方源码
        run: |
          git clone --branch edk2-stable202608 https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init --recursive

      - name: 安装编译环境与配置
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
          cd edk2
          source edksetup.sh
          sed -i 's/-Werror//g' Conf/tools_def.txt
          make -C BaseTools

      - name: 安全修改代码（使用Python脚本）
        run: |
          cd edk2
          python3 -c "
          file_path = 'ShellPkg/Application/Shell/ShellProtocol.c'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()
          insert_code = '\n      ShellFreeEnvVarList();\n      ShellInitEnvVarList();\n'
          target = '*StartImageStatus = StartStatus;'
          if target in content:
              content = content.replace(target, target + insert_code)
              print('代码注入成功！')
          else:
              print('未找到注入点，编译可能会失败')
          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: 开始编译
        run: |
          cd edk2
          source edksetup.sh
          build -t GCC -a X64 -p ShellPkg/ShellPkg.dsc -b RELEASE

      # 下面这两步是修复找不到文件的关键！
      - name: 自动寻找并搬运文件
        run: |
          # 在整个 Build 目录里搜索 Shell.efi，找到后复制到当前工作目录
          find edk2/Build -name "Shell.efi" -exec cp {} ./Shell.efi \;

      - name: 提取最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Shell.efi
          path: Shell.efi
