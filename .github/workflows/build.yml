name: Build UEFI Shell
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载官方源码
        run: |
          git clone --branch edk2-stable202608 https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init --recursive

      - name: 安装编译环境与配置
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
          cd edk2
          source edksetup.sh
          # 移除全局 -Werror，防止警告变报错
          sed -i 's/-Werror//g' Conf/tools_def.txt
          make -C BaseTools

      - name: 自动修改代码与配置文件
        run: |
          cd edk2
          FILE_PATH="ShellPkg/Application/Shell/ShellProtocol.c"
          
          # 1. 补充头文件引用 (确保在同一行插入，不破坏语法)
          sed -i 's/#include "Shell.h"/#include "Shell.h"\n#include "ShellEnvVar.h"/' $FILE_PATH
          
          # 2. 插入刷新缓存的函数调用
          sed -i '/StartStatus = gBS->StartImage (/a\      ShellEnvVarGetAllFromRuntime();' $FILE_PATH
          
          # 3. 直接删除报错的 VariablePolicyDynamicCommand 模块（安全，绝不破坏语法结构）
          sed -i '/VariablePolicyDynamicCommand/d' ShellPkg/ShellPkg.dsc

      - name: 开始编译
        run: |
          cd edk2
          source edksetup.sh
          # 指定使用系统默认的 GCC (即上面设置的 gcc-11)
          build -t GCC -a X64 -p ShellPkg/ShellPkg.dsc -b RELEASE

      - name: 提取最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Shell.efi
          path: edk2/Build/Shell/RELEASE_GCC/X64/Shell.efi
