name: Build UEFI Shell
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载官方源码
        run: |
          git clone --branch edk2-stable202608 https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init --recursive

      - name: 安装编译环境与配置
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
          cd edk2
          source edksetup.sh
          sed -i 's/-Werror//g' Conf/tools_def.txt
          make -C BaseTools

      - name: 安全修改代码与配置文件（终极版）
        run: |
          cd edk2
          
          # 1. 修改 ShellProtocol.c (注入刷新缓存代码)
          python3 -c "
          file_path = 'ShellPkg/Application/Shell/ShellProtocol.c'
          with open(file_path, 'r', encoding='utf-8') as f: content = f.read()
          insert_code = '\n      ShellFreeEnvVarList();\n      ShellInitEnvVarList();\n'
          target = '*StartImageStatus = StartStatus;'
          if target in content:
              content = content.replace(target, target + insert_code)
              with open(file_path, 'w', encoding='utf-8') as f: f.write(content)
          "
          
          # 2. 直接修改 ShellPkg.dsc，强制将启动倒计时设为 0
          # 在 [PcdsFixedAtBuild] 段落下追加 PcdShellDefaultDelay 的定义
          sed -i '/\[PcdsFixedAtBuild\]/a\  gEfiShellPkgTokenSpaceGuid.PcdShellDefaultDelay|0' ShellPkg/ShellPkg.dsc

      - name: 开始编译
        run: |
          cd edk2
          source edksetup.sh
          build -t GCC -a X64 -p ShellPkg/ShellPkg.dsc -b RELEASE

      - name: 自动寻找并搬运文件
        run: |
          find edk2/Build -name "Shell.efi" -exec cp {} ./Shell.efi \;

      - name: 提取最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Shell.efi
          path: Shell.efi
