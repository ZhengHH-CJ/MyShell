name: Build UEFI Shell
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载官方源码
        run: |
          git clone --branch edk2-stable202608 https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init --recursive

      - name: 自动修改代码
        run: |
          cd edk2
          FILE_PATH="ShellPkg/Application/Shell/ShellProtocol.c"
          # 1. 补充头文件引用
          sed -i '/#include "Shell.h"/a #include "ShellEnvVar.h"' $FILE_PATH
          # 2. 插入刷新缓存的函数调用
          sed -i '/StartStatus = gBS->StartImage (/a\      ShellEnvVarGetAllFromRuntime();' $FILE_PATH

      - name: 安装编译环境及降级GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
          cd edk2
          source edksetup.sh
          make -C BaseTools

      - name: 开始编译
        run: |
          cd edk2
          source edksetup.sh
          build -t GCC11 -a X64 -p ShellPkg/ShellPkg.dsc -b RELEASE

      - name: 提取最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Shell.efi
          path: edk2/Build/Shell/RELEASE_GCC11/X64/Shell.efi
